# AIDP 部署流水线模板（GitHub Actions，`cicd.provider: github-actions`，默认提供方）
#
# 拷贝到下游项目的 .github/workflows/deploy-<env>.yml，并在 memory/aidp-config.yaml 登记：
#   cicd:
#     provider: github-actions
#     pipelines: {test: deploy-test.yml}
#
# AIDP 与它的约定只有三条：
#   1. 推送正式代码后由 push 事件自动触发，或由 `cicd_watch.py --mode trigger --env <env> --ref <branch>`
#      手动触发（需声明 workflow_dispatch）；
#   2. 运行记录能按 commit 查到（`cicd_watch.py --mode detect --commit <sha> --env <env>`）——push 触发天然满足；
#   3. 部署完成即结束；应用是否就绪由 `{{AIDP_HOME}}/scripts/autopilot-deploy-watch.py` 探针判断，不在流水线里等。
#
# 构建与部署步骤按项目实际技术栈替换（下面以 Node 前端 + Maven 后端 + SSH 部署为例）。
name: deploy-test

on:
  push:
    branches: [main]
    paths:
      - "code/**"
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: hashFiles('code/frontend/*/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        if: hashFiles('code/frontend/*/package.json') != ''
        run: |
          for d in code/frontend/*/; do
            [ -f "$d/package.json" ] || continue
            (cd "$d" && corepack enable && (pnpm install --frozen-lockfile || npm ci) && (pnpm build || npm run build))
          done

      - name: Setup JDK
        if: hashFiles('code/backend/*/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build backend
        if: hashFiles('code/backend/*/pom.xml') != ''
        run: |
          for d in code/backend/*/; do
            [ -f "$d/pom.xml" ] || continue
            (cd "$d" && mvn -B -DskipTests package)
          done

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "未配置 DEPLOY_HOST，跳过部署（请按项目实际部署方式替换本步骤）"
            exit 0
          fi
          echo "在此处替换为项目实际部署命令（rsync / docker push / kubectl apply 等）"
